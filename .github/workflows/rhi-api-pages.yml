name: Publish FyuuRHI API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rhi-api-pages.yml
      - lib/fyuu_rhi/doc/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install documentation tools
        run: sudo apt-get update && sudo apt-get install --yes doxygen graphviz

      - name: Generate FyuuRHI API pages
        run: |
          mkdir -p build/rhi-api/en build/rhi-api/zh-CN
          doxygen lib/fyuu_rhi/doc/Doxyfile.en
          doxygen lib/fyuu_rhi/doc/Doxyfile.zh-CN
          cp lib/fyuu_rhi/doc/index.html build/rhi-api/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload FyuuRHI API pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/rhi-api

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
