name: Publish FyuuRHI API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rhi-api-pages.yml
      - lib/fyuu_rhi/doc/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload FyuuRHI API pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: lib/fyuu_rhi/doc

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
